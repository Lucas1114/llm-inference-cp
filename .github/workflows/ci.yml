name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the toolchain version from go.mod so CI and local never drift.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Explicit vet is NOT redundant with `go test`: go test runs only a
      # subset of vet's checks, and only on packages it compiles for testing.
      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...
